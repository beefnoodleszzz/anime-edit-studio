# Resolve 能力矩阵 —— 决定「某个能力用哪条路径执行」的唯一真相来源
#
# 规则（不可协商）：
#   1. verified: true 必须由一次真实调用 + 一条测试证明，不得靠 API 文档推断
#   2. verified: false 的能力，EditSpec 生成器禁止产出对应指令
#   3. 存在方法 ≠ 能力可用。probed=true 只代表方法存在，verified=true 才代表实测成功
#   4. 任何 fallback 必须显式声明，绝不假称已执行（沿用旧 extreme.capabilities() 原则）
#
# 探测来源：probe_resolve_capability.py，2026-07-25

version: "0.2"
resolve_version_tested: "21.0.3.7"
edition: studio
script_python: "3.11"          # venv；系统 3.14 与 fusionscript 不兼容
process_name: "Resolve"        # 注意不是 "DaVinci Resolve"，pgrep -x 用此名

env:
  RESOLVE_SCRIPT_API: "/Library/Application Support/Blackmagic Design/DaVinci Resolve/Developer/Scripting"
  RESOLVE_SCRIPT_LIB: "/Applications/DaVinci Resolve/DaVinci Resolve.app/Contents/Libraries/Fusion/fusionscript.so"
  PYTHONPATH_APPEND: "${RESOLVE_SCRIPT_API}/Modules/"

# ─────────────────────────────────────────────────────────────
# 已实测通过（Phase 0 探测）
# ─────────────────────────────────────────────────────────────
capabilities:

  connect:
    path: native_api
    probed: true
    verified: true
    note: "dvr.scriptapp('Resolve')；Resolve 必须前台运行，否则返回 None"

  create_project:
    path: native_api
    api: "ProjectManager.CreateProject / LoadProject / DeleteProject"
    probed: true
    verified: true

  import_media:
    path: native_api
    api: "MediaPool.ImportMedia"
    probed: true
    verified: true

  create_bin:
    path: native_api
    api: "MediaPool.AddSubFolder"
    probed: true
    verified: true           # Phase 1：ensure_bin('source') 实测通过

  create_timeline:
    path: native_api
    api: "MediaPool.CreateEmptyTimeline"
    probed: true
    verified: true

  append_clip_with_in_out:
    path: native_api
    api: "MediaPool.AppendToTimeline([{mediaPoolItem, startFrame, endFrame, trackIndex}])"
    probed: true
    verified: true
    note: "实测一次调用放置 2 个片段，源 in/out 生效。这是 Phase 1 的核心通路"

  set_marker:
    path: native_api
    api: "Timeline.AddMarker(frame, color, name, note, duration) / TimelineItem.AddMarker"
    probed: true
    verified: true
    note: "支持 custom data，可用于把 EditSpec clip_id 写进时间线，实现双向定位"

  transform:
    path: native_api
    api: "TimelineItem.SetProperty"
    probed: true
    verified: true          # 实测 SetProperty('ZoomX', 1.12) -> True
    writable_properties:
      - ZoomX
      - ZoomY
      - ZoomGang
      - Pan
      - Tilt
      - RotationAngle
      - AnchorPointX
      - AnchorPointY
      - Pitch
      - Yaw
      - FlipX
      - FlipY
      - CropLeft
      - CropRight
      - CropTop
      - CropBottom
      - CropSoftness
      - CropRetain
      - Distortion
      - Opacity
      - CompositeMode
      - ResizeFilter
      - RetimeProcess        # 变速插值方式
      - MotionEstimation     # 光流质量
      - DynamicZoomEase
      - Scaling

  add_fusion_comp:
    path: fusion_api
    api: "TimelineItem.AddFusionComp / ImportFusionComp / LoadFusionCompByName / ExportFusionComp"
    probed: true
    verified: true
    evidence: "docs/probes/phase2_risk_probe.json"
    note: |
      Phase 2.0 已验证完整技术闭环：AddTool、参数写入与读回、
      MediaIn → BrightnessContrast → MediaOut 连接、ExportFusionComp、
      ImportFusionComp 全部成功，且渲染帧相对对照发生变化。
      这证明「GUI 制作 → Export .comp → 代码 Import + 注参」可作为 Recipe 路径。
      具体 TimeSpeed 与转场 Recipe 仍须各自验收，不能由本结论自动推导为 verified。

  render:
    path: native_api
    api: "LoadRenderPreset / SetRenderSettings / AddRenderJob / StartRendering / IsRenderingInProgress / GetRenderJobStatus"
    probed: true
    verified: true          # Phase 1.14 实测：多次渲染成功，约 0.7–1.2s / 1 秒素材
    usage: |
      project.LoadRenderPreset("H.264 Master")
      project.SetRenderSettings({"TargetDir": ..., "CustomName": ..., "SelectAllFrames": True})
      job = project.AddRenderJob(); project.StartRendering(job)
      轮询 IsRenderingInProgress()，再读 GetRenderJobStatus(job)
      状态形如 {'JobStatus': '完成', 'CompletionPercentage': 100, 'TimeTakenToRenderInMs': 1192}
    note: "H.264 Master 预设产出 .mov（非 .mp4），按 CustomName.* 匹配产物"
    builtin_presets_relevant:
      - "TikTok - 1080p"
      - "H.264 Master"
      - "H.265 Master"
      - "ProRes 422 HQ"
      - "YouTube - 1080p"
      - "YouTube - 2160p"

  retime_interpolation:
    path: native_api
    api: "SetProperty('RetimeProcess', int) / SetProperty('MotionEstimation', int)"
    probed: true
    verified: true          # Phase 1.14 实测：接受整数 0–3，字符串一律被拒
    note: |
      ★ 必须传整数枚举，传字符串（'OpticalFlow' 等）返回 False。
      0–3 四档均被接受，具体档位含义待 Phase 6 逐档渲染比对确定。

  retime_interpolation_mapping:
    path: native_api
    api: "SetProperty('RetimeProcess'/'MotionEstimation', int)  ← 已废弃，见下方 project_setting_retime_interpolation"
    probed: true
    verified: false
    available: false
    priority: high
    fallback: "project_setting_retime_interpolation（project.SetSetting('imageRetimeInterpolation', str)）"
    evidence: docs/probes/retime_mapping_probe.json
    note: |
      ★ 2026-07-28 渲染对照实测（把 23.976fps 素材摆到 47.952fps 时间线，
      被动 conform，不做显式变速）：per-clip SetProperty('RetimeProcess', int)
      只能触达两种行为（0/1=nearest 复制帧，2/3=frame_blend 交叉溶解），触达不到
      真正的运动补偿光流；'Speed'/'SpeedPercent' 属性也一律被拒。
      这条 per-clip 整数属性路径已废弃 —— 真正生效的入口是工程级字符串设置，
      见 project_setting_retime_interpolation。若某个 clip 之前被 SetProperty
      显式写过 RetimeProcess/MotionEstimation，这个 per-clip 值会盖过工程级
      设置，必须用从未被脚本碰过的新 clip 才能验证工程级设置的效果。

  project_setting_retime_interpolation:
    path: native_api
    api: "project.SetSetting('imageRetimeInterpolation', str) / project.SetSetting('imageMotionEstimationMode', str)"
    probed: true
    verified: true
    evidence: docs/probes/retime_project_setting_fresh_probe.json
    note: |
      ★ 2026-07-28 用从未被 per-clip SetProperty 碰过的新 clip 实测确认。
      imageRetimeInterpolation 只接受三个精确字符串（大小写敏感，camelCase）：
        "nearest" | "frameBlend" | "opticalFlow"
      "speedWarp"（含所有大小写/拼写变体）一律被拒 —— Speed Warp 在这个工程
      级设置里不存在，目前找不到任何脚本入口能激活它（Speed 相关 per-clip
      属性也全部被拒，见 retime_interpolation_mapping）。Speed Warp 只能靠
      GUI 手动拖 retime 手柄 / Change Clip Speed 对话框，脚本层暂时是死路。
      imageMotionEstimationMode 接受: "standardFaster" | "standardBetter" |
        "enhancedFaster" | "enhancedBetter"
      渲染对照（23.976fps clip 摆到 47.952fps 时间线，被动 conform）：
        nearest:     52/70 帧对完全重复（丢帧复制）
        frameBlend:  0 重复帧，插值帧 Laplacian 锐度约为相邻真帧的 50%（重影/溶解）
        opticalFlow: 0 重复帧，插值帧锐度约为相邻真帧的 80-90%（运动补偿，非溶解）
      三档清晰可辨，可安全用于生成 EditSpec 的
      retime.interpolation: nearest|frame_blend|optical_flow 枚举。
      注意生效前提：目标 clip 不能有遗留的 per-clip RetimeProcess/MotionEstimation
      SetProperty 覆盖，否则工程级设置不生效。

# ─────────────────────────────────────────────────────────────
# 方法已确认存在，待 Phase 1/6 实测（这些是本次探测最大的收获）
# ─────────────────────────────────────────────────────────────

  # ─── 以下三项经 Phase 1.12–1.14 实测判定为不可用 ───
  # 教训：hasattr / 方法存在 完全不能作为可用性依据，必须实跑并验证输出。

  speed_ramp:
    path: unsupported
    api: "TimelineItem.SetSpeedRamp"
    probed: true
    verified: false
    available: false
    fallback: "Fusion comp 内做变速（TimeSpeed / TimeStretcher 节点），经 ImportFusionComp 注入"
    priority: high
    evidence: probe_key_capabilities2.py
    note: |
      ★ hasattr 假阳性 ★
      dir(item) 中存在 SetSpeedRamp，但 item.SetSpeedRamp 的值是 None，
      callable() 为 False —— 方法在 21.0.3 中并不存在。
      Resolve 的远程对象对未知属性返回 None 而非抛 AttributeError，
      因此 hasattr 恒为 True。
      同时探测：Speed / SpeedPercent / PlaybackSpeed 属性均不可写，
      片段上与变速相关的方法只有 GetDuration。
      结论：**Resolve 21.0.3 没有逐片段变速的脚本接口**。
      变速必须走 Fusion Recipe 路线（add_fusion_comp 已 verified）。

  timespeed_recipe:
    path: fusion_api
    api: "Fusion TimeSpeed / TimeStretcher Recipe"
    probed: true
    verified: true
    priority: high
    evidence: "docs/probes/fusion_motion_acceptance.json"
    note: |
      Resolve 21.0.3.7 实渲通过：96 帧输入与输出时长一致，入口/冲击/出口
      三个采样点均相对基线发生变化。速度参数作为相对权重积分后归一化，
      保证 SourceTime 首尾严格落在可用源帧内（见 P20）。

  camera_move_recipe:
    path: fusion_api
    api: "Fusion Transform keyframes Recipe"
    probed: false
    verified: false
    priority: high
    note: "push/pan 动画须由已验收 Recipe 执行；静态 SetProperty(transform) 不可冒充动画。"

  subject_tracking:
    path: unsupported
    api: "TimelineItem.CreateMagicMask / RegenerateMagicMask"
    probed: true
    verified: false
    available: false
    fallback: "自研主体检测（Phase 3）+ 手动 Pan/ZoomX（transform 已 verified）"
    priority: high
    edition_required: studio
    evidence: probe_key_capabilities.py, probe_key_capabilities2.py
    note: |
      所有签名（'F' / 'B' / 'BI' / 无参 / 整数）一律返回 False，
      切到 Color 页并定位时间码后重试仍为 False，节点数不变（保持 1）。
      判定为脚本接口不可用。

  portrait_reframe:
    path: unsupported
    api: "TimelineItem.SmartReframe"
    probed: true
    verified: false
    available: false
    fallback: "自研主体感知 + SetProperty('Pan'/'ZoomX')，后者已 verified"
    priority: critical
    edition_required: studio
    evidence: probe_smartreframe_visual.py, smartreframe_visual.json
    note: |
      ★ 最重要的否定结论，且是「返回 True 但空转」这一类最危险的失败 ★

      SmartReframe() 返回 True，但：
        - GetProperty 的 Pan/ZoomX/Tilt 全部不变
        - 渲染输出与基线**逐字节相同**（首帧 md5 一致）

      判定方法的可信度已由对照组建立：
      同一片段手动 SetProperty('Pan', 400) 后重渲，md5 改变、YAVG 从 80.6 变为 50.8。
      即检测手段有效，SmartReframe 确实没有产生任何效果。

      （第一版探测曾误取 780s 之外的黑场画面，导致对照组也"无差异"。
        黑场上任何重构图都不可见 —— 视觉验证必须先确认画面有内容。）

      影响：横屏→默认 1:1 画布的主体感知重构图无法依赖 Resolve 原生能力，
      改为在 Phase 3 用自研主体检测产出 Pan/ZoomX 参数，
      再经已验证的 transform 通道写入。可控性反而更好，但工作量增加。

  stabilize:
    path: native_api
    api: "TimelineItem.Stabilize"
    probed: true
    verified: false
    priority: low

  color_recipe:
    path: native_api
    api: "SetLUT / SetCDL / GetNodeGraph / CopyGrades / AssignToColorGroup / AddVersion"
    probed: true
    verified: true
    priority: high
    evidence: "docs/probes/phase2_risk_probe.json"
    note: |
      Phase 2.0 实测：创建 ColorGroup、两个 clip 入组、AddVersion 均成功；
      在 group post-clip graph 设置 Resolve 已登记的 LUT 后，渲染帧哈希与统计改变。
      因此 Color Recipe 架构冻结为「一个 Recipe 对应一个 ColorGroup」。
      注意 Graph.SetLUT 只接受 Resolve LUT 注册表中的路径；任意外部绝对路径会返回 False。

  export_lut:
    path: native_api
    api: "TimelineItem.ExportLUT"
    probed: true
    verified: false
    note: "可把调好的 grade 导成 LUT，作为 recipe 产物存档"

  scene_cut_detection:
    path: native_api
    api: "Timeline.DetectSceneCuts"
    probed: true
    verified: false
    priority: low
    note: "Resolve 自带分镜检测，可与 PySceneDetect 结果交叉验证"

  subtitles_from_audio:
    path: native_api
    api: "Timeline.CreateSubtitlesFromAudio"
    probed: true
    verified: false
    priority: low
    note: "可能替代 whisper.cpp 做台词提取"

  fusion_title_generator:
    path: fusion_api
    api: "Timeline.InsertFusionTitleIntoTimeline / InsertFusionCompositionIntoTimeline"
    probed: true
    verified: false
    note: "Hook 文案层（旧 TextOverlay）的落地路径"

# ─────────────────────────────────────────────────────────────
# Phase 2.0 专业能力预探测
# ─────────────────────────────────────────────────────────────

  transition:
    path: fusion_recipe
    probed: true
    verified: true
    fallback: hard_cut
    priority: high
    evidence: "docs/probes/fusion_motion_acceptance.json"
    note: |
      Timeline / TimelineItem 均无原生 transition API。
      自动链采用双侧 Fusion bridge：前镜出口与后镜入口由同一 Whip/Blur Recipe
      协调，不合并 TimelineItem，因此 clip_id、总时长和连续多切点能力均保留。
      96 帧 A/B 实渲验证：切点两侧发生变化、远端身份保持、总帧数不变。

  motion_phrase_compositor:
    path: fusion_api
    api: "one-comp TimeStretcher + Transform + DirectionalBlur choreography"
    probed: true
    verified: true
    priority: high
    evidence: "docs/probes/motion_phrase_acceptance.json"
    note: |
      将 MotionPhrase 的 hold/accelerate/whip/carry/settle/reverse 编译到每个
      TimelineItem 的单个 Fusion comp，解决 Resolve 多 comp 仅为版本、不可串联的问题。
      Resolve 21.0.3.7 实渲：6 秒 144 帧完整；动态范围 2.11、hold 21.7%，
      跨切点运动连续性由基线 0.00 提升至 0.90。

  fairlight_automation:
    path: unsupported
    probed: true
    verified: false
    available: false
    fallback: "execution/audio 确定性预烘焙音量包络与 Sound Recipe WAV，再导入已验证的 Resolve 音轨完成最终混音"
    priority: high
    evidence: "docs/probes/phase2_risk_probe.json"
    note: |
      Resolve 21.0.3.7 的公开脚本对象没有音量/增益/自动化/关键帧方法。
      对音频 TimelineItem 写 Volume / AudioVolume / Gain / Pan 全部返回 False，
      GetProperty 也无对应字段。GUI Automation 默认禁用，不能作为主链。

  sound_recipe_prebake:
    path: deterministic_fallback
    api: "FFmpeg PCM24 pre-bake + MediaPool.AppendToTimeline(mediaType=2)"
    probed: true
    verified: true
    priority: high
    evidence: "docs/probes/sound_recipe_prebake_acceptance.json"
    note: |
      Phase 6 真机实测四条 Sound Recipe 预烘焙后分别进入 Resolve 四条音轨，
      H.264 Master 渲染保留 48 kHz stereo 音轨。默认增益叠加时 true peak
      -11.7 dBFS；公开 API 不承担任何 Fairlight automation。

  audio_track_management:
    path: native_api
    api: "Timeline.AddTrack('audio', ...)"
    probed: true
    verified: true
    priority: high
    evidence: "docs/probes/phase2_risk_probe.json"
    note: "Phase 2.0 实测 AddTrack('audio', 'stereo') 成功，音轨数从 1 增至 2。"

  gui_automation:
    path: gui_fallback
    probed: false
    verified: false
    enabled: false            # 默认禁用，需显式开关且必须记录
    note: "MASTER PLAN §25：最后手段，禁止设计成核心能力"

# ─────────────────────────────────────────────────────────────
# 实测踩到的坑（写进来防止重复踩）
# ─────────────────────────────────────────────────────────────
pitfalls:
  - id: P1
    issue: "进程名是 Resolve 不是 DaVinci Resolve"
    impact: "pgrep -x 'DaVinci Resolve' 永远失败，会误判未运行"
    fix: "健康检查用 pgrep -x Resolve"

  - id: P2
    issue: "Resolve 未运行时 scriptapp('Resolve') 静默返回 None，不抛异常"
    impact: "错误信息不明确，难排查"
    fix: "connection.py 必须显式判空并给出「请先启动 Resolve」的提示"

  - id: P3
    issue: "系统 Python 3.14 与 fusionscript 不兼容"
    impact: "import 失败"
    fix: "强制 venv 3.11；connection.py 启动时校验 sys.version_info"

  - id: P4
    issue: "素材实际 FPS 是 23.976（实测代理 1920x1080 / H.264 / 23.976）"
    impact: |
      旧 EditSpec 硬编 60fps 是错的。23.976 是非整数帧率，
      帧制 IR 必然产生亚帧漂移累积。
    fix: "EditSpec 以秒为权威 + 显式 timebase，帧数由 compiler 换算（TARGET §3.1 A1 决策由此得到实测支持）"

  - id: P5
    issue: "Resolve 必须前台运行，无真正 headless"
    impact: "批量自动化受限"
    fix: "启动等待 + 健康检查；渲染任务串行排队"

  # ── 以下为 Phase 1 实测新增（2026-07-25），每一条都曾导致片段静默错位 ──

  - id: P6
    issue: "源素材自带的章节标记会被时间线片段继承，且 Resolve 拒绝在已有标记的帧上再加标记"
    impact: |
      蓝光/WEB 片源常在第 0 帧就有 "Chapter N"。
      在第 0 帧写 clip_id 标记会静默失败，导致增量更新无法定位该片段。
    fix: "mark_clip 向后扫描第一个空闲帧；查找时只认 aes: 前缀的 customData"

  - id: P7
    issue: "GetSourceStartFrame() 含媒体起始时间码；GetLeftOffset() 在跨帧率时被套格重映射"
    impact: |
      实测 29.97 素材放进 24fps 时间线，请求源帧 720 后 GetLeftOffset() 返回 576。
      用任一帧号反推源入点都会错。
    fix: "统一用 GetSourceStartTime() / GetSourceEndTime()，它们直接返回秒，跨帧率语义稳定"

  - id: P8
    issue: "AppendToTimeline 的 endFrame 是开区间"
    impact: "按闭区间处理会让每个片段少一帧"
    fix: "endFrame = startFrame + 帧数，不减 1。实测 240→288 得 48 帧"

  - id: P9
    issue: "时间线起始帧默认是 86400（01:00:00:00），不是 0"
    impact: |
      recordFrame 若不加这个偏移，第二个及以后的片段会被静默丢弃 ——
      AppendToTimeline 对失败项返回 None 而不抛异常。
    fix: "recordFrame = timeline.GetStartFrame() + 目标帧；并显式检查返回值中的 None"

  - id: P10
    issue: "AppendToTimeline 只能在时间线末端追加，无法填补轨道中间的空洞"
    impact: |
      ★ 架构级约束 ★
      「删掉变化的片段再插回原位」这条增量更新路线走不通，该位置返回 None。
    fix: |
      时间线总是全量重建（按时间线位置升序放置）；
      增量下沉到渲染层 —— compiler 报告 changed_ranges，只渲变化区间。
      在 Resolve 里搭时间线是廉价的，渲染才是昂贵的。

  - id: P11
    issue: "源帧数按「入点 floor + 出点 ceil」计算会让片段多出一帧"
    impact: "实测 29.97 素材取 2.0s 得 61 源帧，套格到 24fps 后是 49 帧而非 48"
    fix: "按时长取帧：n = duration_frames(in, duration)，end = start + n"

  - id: P12
    issue: "hasattr / dir() 对 Resolve 远程对象是假阳性"
    impact: |
      ★ 方法论级教训 ★
      远程对象对未知属性返回 None 而非抛 AttributeError，
      因此 hasattr(item, 'SetSpeedRamp') 恒为 True，即便该方法根本不存在。
      Phase 0 的能力探测正是因此误把 SetSpeedRamp 记为「方法存在」。
    fix: |
      判定可用性必须三步走：
        1. callable(getattr(obj, name, None)) —— 而非 hasattr
        2. 实际调用并检查返回值
        3. 验证**输出确实改变**（渲染出帧比对）
      能力矩阵中 probed / verified / available 三个字段分别对应这三步。

  - id: P13
    issue: "「返回 True 但不生效」是 Resolve API 最危险的失败模式"
    impact: |
      SmartReframe() 返回 True，属性不变，渲染输出逐字节相同。
      只看返回值会得出完全错误的结论，并把它写进能力矩阵传播下去。
    fix: |
      凡是影响画面的能力，verified 必须由**渲染出帧比对**支撑，不能只看返回值。
      且必须先跑对照组（一个已知会改变画面的操作）确认检测手段有效。

  - id: P14
    issue: "视觉比对若取到黑场，任何变化都不可见"
    impact: "第一版 SmartReframe 验证误取近全黑帧（YAVG≈30），连对照组都判为无差异"
    fix: "比对前先扫描素材挑亮度适中的时间点（40 < YAVG < 200）"

  - id: P15
    issue: "Color Graph.SetLUT 不接受任意外部绝对路径"
    impact: "调用返回 False，若只假设文件存在会导致 Color Recipe 静默不生效"
    fix: "Recipe LUT 必须安装/登记进 Resolve LUT 注册表；SetLUT 后检查返回值并渲染对照"

  - id: P16
    issue: "Resolve 21.0.3.7 公共脚本 API 无 Fairlight 音量自动化"
    impact: "可建音轨但无法脚本写 clip/track 音量关键帧，Sound Recipe 主链不能依赖 Fairlight Automation"
    fix: "在 execution/audio 中确定性预烘焙包络与 WAV，再导入 Resolve 音轨；禁止用 GUI Automation 冒充主链"

  - id: P17
    issue: "Timeline 与 TimelineItem 无原生 Transition API"
    impact: "EditSpec transition 不能编译为原生时间线调用"
    fix: "使用 Fusion transition Recipe；完成重叠语义与渲染对照前 capability 保持 unverified，默认 hard_cut"

  - id: P18
    issue: "Render TargetDir 使用相对路径时 SetRenderSettings 可成功，但 AddRenderJob 返回失败"
    impact: "时间线已完整构建却无法创建渲染任务，错误直到 AddRenderJob 才暴露"
    fix: "ResolveAdapter.render 在接触 API 前统一 expanduser().resolve()，永远传绝对输出目录"

  - id: P19
    issue: "AppendToTimeline 省略 mediaType 会把视频的原片音频一并放入时间线"
    impact: "设计音乐虽已写入，成片仍混入角色对白/原声；音乐增益调整看似不生效"
    fix: "视频 clip 强制 mediaType=1；音乐、SFX 与允许的源音频全部作为显式 AudioLayer 用 mediaType=2 放置"

  - id: P20
    issue: "Fusion TimeStretcher 的 SourceTime 超出 MediaIn 可用帧时会静默截短渲染"
    impact: "96 帧片段实测只输出 66 帧，镜头和成片总时长都会无提示缩短"
    fix: "把 entry/impact/exit 速度视为相对权重，积分后归一化到 0..duration-1；实渲强制核对输入/输出帧数"

  - id: P21
    issue: "在 Whip/Blur 峰值帧上计算光流会因跟踪点丢失而把高速运动误判为静止"
    impact: "真实跨切点 Carry 会被 QA 错判为不连续，导致错误调整运动公式"
    fix: "跨 Cut 连续性采样必须位于动态 Blur 包络之外；当前 7 帧包络使用 Cut 前 -8→-6 与 Cut 后 +6→+8"
