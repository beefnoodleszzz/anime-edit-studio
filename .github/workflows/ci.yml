name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  # 架构规则守卫。这些失败 = 架构被破坏，不是"测试挂了"。
  # 不依赖 Resolve，可在 Linux runner 上跑。
  architecture-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv venv --python 3.11
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Enforce AGENTS.md rules
        run: uv run pytest tests/test_architecture_rules.py -v

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv venv --python 3.11
      - name: Install
        run: uv pip install -e ".[dev,review]"
      - name: Run tests
        # 需要真实 Resolve 的测试用 marker 排除，只能本机跑
        run: uv run pytest -q -m "not requires_resolve"

# 本机跑 Resolve 相关测试：
#   .venv/bin/python -m pytest -m requires_resolve
#
# v1 的 frontend-build / renderer typecheck 已随 Remotion 一起废弃。
# review-web 将在 Phase 9 重写后重新加入 CI。
