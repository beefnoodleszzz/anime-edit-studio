# anime-edit-studio 全局配置 —— 工具路径与交付规格
# 路径已按本机实测填好(~ 会被展开)。

[tools]
ffmpeg  = "ffmpeg"
ffprobe = "ffprobe"
whisper = "whisper-cli"                                              # whisper.cpp
realesrgan        = "~/.local/bin/realesrgan-ncnn-vulkan"
realesrgan_models = "~/.local/opt/realesrgan-ncnn-vulkan/models"
realesrgan_model  = "realesr-animevideov3-x2"                        # 动漫 2x
rife       = "~/.local/opt/rife-ncnn-vulkan/rife-ncnn-vulkan"
rife_model = "~/.local/opt/rife-ncnn-vulkan/rife-v4.6"
chrome     = "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
# LAION 美学评分头(nn.Linear(512,1),配 OpenAI CLIP ViT-B/32)。缺失则筛选走清晰度启发式降级。
aesthetic_model = "kit/models/sa_0_4_vit_b_32_linear.pth"

[delivery]
canvas = "4x5"                      # 新作品固定竖屏 4:5；auto 仅作显式 legacy 例外
fps    = 60
master_lufs = -10.0                 # 高能短视频母带；平台差异由 preset 显式覆盖
true_peak_dbfs = -1.0
master_codec   = "prores_videotoolbox"   # 母版
platform_codec = "h264_videotoolbox"      # 平台版

[library]
# 本地素材库根目录(被 ingest 的源文件永久住这里,入库后勿移动/改名)。
# `anime library add` 归位到 sources_root/<series>/<season>/;可用 ANIME_MATERIAL_ROOT 覆盖。
sources_root = "~/Desktop/anime-material-library/sources"

[proxy]
edit_height     = 1080   # 剪辑/预览代理
analysis_height = 540    # 分析代理(更快)

[models]
# M1 默认纯文本检索(FTS);向量/VLM 打标为后续升级项
embedding = "none"       # none | clip | vlm-api

[look]
# 签名调色 LUT(master 阶段以真 3D lut3d 应用);留空则不套 LUT
lut = "kit/luts/signature_teal_orange.cube"

[scoring.weights]
technical_quality = 0.15
composition_quality = 0.15
brief_match = 0.20
structure_match = 0.15
preference_score = 0.20
diversity_score = 0.10
risk_penalty = 0.05
