# Resolve 能力矩阵 —— 决定「某个能力用哪条路径执行」的唯一真相来源
#
# 规则（不可协商）：
#   1. verified: true 必须由一次真实调用 + 一条测试证明，不得靠 API 文档推断
#   2. verified: false 的能力，EditSpec 生成器禁止产出对应指令
#   3. 存在方法 ≠ 能力可用。probed=true 只代表方法存在，verified=true 才代表实测成功
#   4. 任何 fallback 必须显式声明，绝不假称已执行（沿用旧 extreme.capabilities() 原则）
#
# 探测来源：probe_resolve_capability.py，2026-07-25

version: "0.1"
resolve_version_tested: "21.0.3.7"
edition: studio
script_python: "3.11"          # venv；系统 3.14 与 fusionscript 不兼容
process_name: "Resolve"        # 注意不是 "DaVinci Resolve"，pgrep -x 用此名

env:
  RESOLVE_SCRIPT_API: "/Library/Application Support/Blackmagic Design/DaVinci Resolve/Developer/Scripting"
  RESOLVE_SCRIPT_LIB: "/Applications/DaVinci Resolve/DaVinci Resolve.app/Contents/Libraries/Fusion/fusionscript.so"
  PYTHONPATH_APPEND: "${RESOLVE_SCRIPT_API}/Modules/"

# ─────────────────────────────────────────────────────────────
# 已实测通过（Phase 0 探测）
# ─────────────────────────────────────────────────────────────
capabilities:

  connect:
    path: native_api
    probed: true
    verified: true
    note: "dvr.scriptapp('Resolve')；Resolve 必须前台运行，否则返回 None"

  create_project:
    path: native_api
    api: "ProjectManager.CreateProject / LoadProject / DeleteProject"
    probed: true
    verified: true

  import_media:
    path: native_api
    api: "MediaPool.ImportMedia"
    probed: true
    verified: true

  create_bin:
    path: native_api
    api: "MediaPool.AddSubFolder"
    probed: true
    verified: false          # 方法存在，尚未实测

  create_timeline:
    path: native_api
    api: "MediaPool.CreateEmptyTimeline"
    probed: true
    verified: true

  append_clip_with_in_out:
    path: native_api
    api: "MediaPool.AppendToTimeline([{mediaPoolItem, startFrame, endFrame, trackIndex}])"
    probed: true
    verified: true
    note: "实测一次调用放置 2 个片段，源 in/out 生效。这是 Phase 1 的核心通路"

  set_marker:
    path: native_api
    api: "Timeline.AddMarker(frame, color, name, note, duration) / TimelineItem.AddMarker"
    probed: true
    verified: true
    note: "支持 custom data，可用于把 EditSpec clip_id 写进时间线，实现双向定位"

  transform:
    path: native_api
    api: "TimelineItem.SetProperty"
    probed: true
    verified: true          # 实测 SetProperty('ZoomX', 1.12) -> True
    writable_properties:
      - ZoomX
      - ZoomY
      - ZoomGang
      - Pan
      - Tilt
      - RotationAngle
      - AnchorPointX
      - AnchorPointY
      - Pitch
      - Yaw
      - FlipX
      - FlipY
      - CropLeft
      - CropRight
      - CropTop
      - CropBottom
      - CropSoftness
      - CropRetain
      - Distortion
      - Opacity
      - CompositeMode
      - ResizeFilter
      - RetimeProcess        # 变速插值方式
      - MotionEstimation     # 光流质量
      - DynamicZoomEase
      - Scaling

  add_fusion_comp:
    path: fusion_api
    api: "TimelineItem.AddFusionComp / ImportFusionComp / LoadFusionCompByName / ExportFusionComp"
    probed: true
    verified: true          # AddFusionComp 实测返回 comp 对象
    note: |
      Recipe 注入路径已确认可行，且 ExportFusionComp 存在——
      意味着 recipe 可以在 Fusion GUI 里手工做好后导出 .comp，
      代码只负责 Import + 参数注入，不需要用脚本从零搭节点图。
      这实质性降低了 Recipe 库的建设成本。

  render:
    path: native_api
    api: "AddRenderJob / StartRendering / GetRenderJobStatus / SetRenderSettings / IsRenderingInProgress"
    probed: true
    verified: false
    builtin_presets_relevant:
      - "TikTok - 1080p"
      - "H.264 Master"
      - "H.265 Master"
      - "ProRes 422 HQ"
      - "YouTube - 1080p"
      - "YouTube - 2160p"

# ─────────────────────────────────────────────────────────────
# 方法已确认存在，待 Phase 1/6 实测（这些是本次探测最大的收获）
# ─────────────────────────────────────────────────────────────

  speed_ramp:
    path: native_api
    api: "TimelineItem.SetSpeedRamp"
    probed: true
    verified: false
    fallback: "分段常速 + RetimeProcess=optical_flow"
    priority: high
    note: "R1 风险大幅下降：原假设 API 不支持关键帧变速，实测方法存在"

  retime_quality:
    path: native_api
    api: "SetProperty('RetimeProcess'), SetProperty('MotionEstimation')"
    probed: true
    verified: false
    priority: high
    note: |
      Resolve 原生光流变速可控。若质量达标，旧系统的 RIFE 外挂在
      大部分场景可以直接省掉——这是效率与画质双赢点，Phase 6 必须验证。

  subject_tracking:
    path: native_api
    api: "TimelineItem.CreateMagicMask / RegenerateMagicMask"
    probed: true
    verified: false
    fallback: "静态 reframe（不做主体跟踪）"
    priority: high
    edition_required: studio
    note: |
      Studio 独有。旧系统用 rembg 出静态遮罩，无跟踪。
      Magic Mask 是 §5 'subject tracking' 的原生实现。

  portrait_reframe:
    path: native_api
    api: "TimelineItem.SmartReframe"
    probed: true
    verified: false
    fallback: "手动 Pan/ZoomX（旧系统的 reframe_x 等价物）"
    priority: critical
    edition_required: studio
    note: |
      ★ 本次探测最重要的发现 ★
      横屏动漫源 → 4:5 竖屏交付是本项目每一条片子都要做的事，
      旧系统靠 reframe_x 单轴偏移手搓。SmartReframe 是 Resolve Studio
      的主体感知自动重构图。若可用，直接消灭一整类人工与一整类质量问题。
      Phase 1 就应验证，不要等到 Phase 6。

  stabilize:
    path: native_api
    api: "TimelineItem.Stabilize"
    probed: true
    verified: false
    priority: low

  color_recipe:
    path: native_api
    api: "SetLUT / SetCDL / GetNodeGraph / CopyGrades / AssignToColorGroup / AddVersion"
    probed: true
    verified: false
    priority: high
    note: |
      ColorGroup + Version 是比逐 clip 调色更好的架构：
      一个 Color Recipe = 一个 ColorGroup，clip 加入 group 即继承调色，
      改 recipe 只需改 group。这比 EditSpec 里每个 clip 存一份 grade 干净得多。

  export_lut:
    path: native_api
    api: "TimelineItem.ExportLUT"
    probed: true
    verified: false
    note: "可把调好的 grade 导成 LUT，作为 recipe 产物存档"

  scene_cut_detection:
    path: native_api
    api: "Timeline.DetectSceneCuts"
    probed: true
    verified: false
    priority: low
    note: "Resolve 自带分镜检测，可与 PySceneDetect 结果交叉验证"

  subtitles_from_audio:
    path: native_api
    api: "Timeline.CreateSubtitlesFromAudio"
    probed: true
    verified: false
    priority: low
    note: "可能替代 whisper.cpp 做台词提取"

  fusion_title_generator:
    path: fusion_api
    api: "Timeline.InsertFusionTitleIntoTimeline / InsertFusionCompositionIntoTimeline"
    probed: true
    verified: false
    note: "Hook 文案层（旧 TextOverlay）的落地路径"

# ─────────────────────────────────────────────────────────────
# 未探测 / 未知
# ─────────────────────────────────────────────────────────────

  transition:
    path: unverified
    probed: false
    verified: false
    fallback: hard_cut
    priority: high
    note: "TimelineItem 上未见直接的 transition API，需研究 Timeline 层或 Fusion 转场方案"

  fairlight_automation:
    path: unverified
    probed: false
    verified: false
    fallback: "ffmpeg 音频床（旧 sound.py 路径）"
    priority: medium

  audio_track_management:
    path: native_api
    api: "Timeline.AddTrack('audio', ...)"
    probed: true
    verified: false
    priority: high

  gui_automation:
    path: gui_fallback
    probed: false
    verified: false
    enabled: false            # 默认禁用，需显式开关且必须记录
    note: "MASTER PLAN §25：最后手段，禁止设计成核心能力"

# ─────────────────────────────────────────────────────────────
# 实测踩到的坑（写进来防止重复踩）
# ─────────────────────────────────────────────────────────────
pitfalls:
  - id: P1
    issue: "进程名是 Resolve 不是 DaVinci Resolve"
    impact: "pgrep -x 'DaVinci Resolve' 永远失败，会误判未运行"
    fix: "健康检查用 pgrep -x Resolve"

  - id: P2
    issue: "Resolve 未运行时 scriptapp('Resolve') 静默返回 None，不抛异常"
    impact: "错误信息不明确，难排查"
    fix: "connection.py 必须显式判空并给出「请先启动 Resolve」的提示"

  - id: P3
    issue: "系统 Python 3.14 与 fusionscript 不兼容"
    impact: "import 失败"
    fix: "强制 venv 3.11；connection.py 启动时校验 sys.version_info"

  - id: P4
    issue: "素材实际 FPS 是 23.976（实测代理 1920x1080 / H.264 / 23.976）"
    impact: |
      旧 EditSpec 硬编 60fps 是错的。23.976 是非整数帧率，
      帧制 IR 必然产生亚帧漂移累积。
    fix: "EditSpec 以秒为权威 + 显式 timebase，帧数由 compiler 换算（TARGET §3.1 A1 决策由此得到实测支持）"

  - id: P5
    issue: "Resolve 必须前台运行，无真正 headless"
    impact: "批量自动化受限"
    fix: "启动等待 + 健康检查；渲染任务串行排队"
