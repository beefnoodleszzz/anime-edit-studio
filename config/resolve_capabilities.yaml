# Resolve 能力矩阵 —— 决定「某个能力用哪条路径执行」的唯一真相来源
#
# 规则（不可协商）：
#   1. verified: true 必须由一次真实调用 + 一条测试证明，不得靠 API 文档推断
#   2. verified: false 的能力，EditSpec 生成器禁止产出对应指令
#   3. 存在方法 ≠ 能力可用。probed=true 只代表方法存在，verified=true 才代表实测成功
#   4. 任何 fallback 必须显式声明，绝不假称已执行（沿用旧 extreme.capabilities() 原则）
#
# 探测来源：probe_resolve_capability.py，2026-07-25

version: "0.1"
resolve_version_tested: "21.0.3.7"
edition: studio
script_python: "3.11"          # venv；系统 3.14 与 fusionscript 不兼容
process_name: "Resolve"        # 注意不是 "DaVinci Resolve"，pgrep -x 用此名

env:
  RESOLVE_SCRIPT_API: "/Library/Application Support/Blackmagic Design/DaVinci Resolve/Developer/Scripting"
  RESOLVE_SCRIPT_LIB: "/Applications/DaVinci Resolve/DaVinci Resolve.app/Contents/Libraries/Fusion/fusionscript.so"
  PYTHONPATH_APPEND: "${RESOLVE_SCRIPT_API}/Modules/"

# ─────────────────────────────────────────────────────────────
# 已实测通过（Phase 0 探测）
# ─────────────────────────────────────────────────────────────
capabilities:

  connect:
    path: native_api
    probed: true
    verified: true
    note: "dvr.scriptapp('Resolve')；Resolve 必须前台运行，否则返回 None"

  create_project:
    path: native_api
    api: "ProjectManager.CreateProject / LoadProject / DeleteProject"
    probed: true
    verified: true

  import_media:
    path: native_api
    api: "MediaPool.ImportMedia"
    probed: true
    verified: true

  create_bin:
    path: native_api
    api: "MediaPool.AddSubFolder"
    probed: true
    verified: true           # Phase 1：ensure_bin('source') 实测通过

  create_timeline:
    path: native_api
    api: "MediaPool.CreateEmptyTimeline"
    probed: true
    verified: true

  append_clip_with_in_out:
    path: native_api
    api: "MediaPool.AppendToTimeline([{mediaPoolItem, startFrame, endFrame, trackIndex}])"
    probed: true
    verified: true
    note: "实测一次调用放置 2 个片段，源 in/out 生效。这是 Phase 1 的核心通路"

  set_marker:
    path: native_api
    api: "Timeline.AddMarker(frame, color, name, note, duration) / TimelineItem.AddMarker"
    probed: true
    verified: true
    note: "支持 custom data，可用于把 EditSpec clip_id 写进时间线，实现双向定位"

  transform:
    path: native_api
    api: "TimelineItem.SetProperty"
    probed: true
    verified: true          # 实测 SetProperty('ZoomX', 1.12) -> True
    writable_properties:
      - ZoomX
      - ZoomY
      - ZoomGang
      - Pan
      - Tilt
      - RotationAngle
      - AnchorPointX
      - AnchorPointY
      - Pitch
      - Yaw
      - FlipX
      - FlipY
      - CropLeft
      - CropRight
      - CropTop
      - CropBottom
      - CropSoftness
      - CropRetain
      - Distortion
      - Opacity
      - CompositeMode
      - ResizeFilter
      - RetimeProcess        # 变速插值方式
      - MotionEstimation     # 光流质量
      - DynamicZoomEase
      - Scaling

  add_fusion_comp:
    path: fusion_api
    api: "TimelineItem.AddFusionComp / ImportFusionComp / LoadFusionCompByName / ExportFusionComp"
    probed: true
    verified: true          # AddFusionComp 实测返回 comp 对象
    note: |
      Recipe 注入路径已确认可行，且 ExportFusionComp 存在——
      意味着 recipe 可以在 Fusion GUI 里手工做好后导出 .comp，
      代码只负责 Import + 参数注入，不需要用脚本从零搭节点图。
      这实质性降低了 Recipe 库的建设成本。

  render:
    path: native_api
    api: "LoadRenderPreset / SetRenderSettings / AddRenderJob / StartRendering / IsRenderingInProgress / GetRenderJobStatus"
    probed: true
    verified: true          # Phase 1.14 实测：多次渲染成功，约 0.7–1.2s / 1 秒素材
    usage: |
      project.LoadRenderPreset("H.264 Master")
      project.SetRenderSettings({"TargetDir": ..., "CustomName": ..., "SelectAllFrames": True})
      job = project.AddRenderJob(); project.StartRendering(job)
      轮询 IsRenderingInProgress()，再读 GetRenderJobStatus(job)
      状态形如 {'JobStatus': '完成', 'CompletionPercentage': 100, 'TimeTakenToRenderInMs': 1192}
    note: "H.264 Master 预设产出 .mov（非 .mp4），按 CustomName.* 匹配产物"
    builtin_presets_relevant:
      - "TikTok - 1080p"
      - "H.264 Master"
      - "H.265 Master"
      - "ProRes 422 HQ"
      - "YouTube - 1080p"
      - "YouTube - 2160p"

  retime_interpolation:
    path: native_api
    api: "SetProperty('RetimeProcess', int) / SetProperty('MotionEstimation', int)"
    probed: true
    verified: true          # Phase 1.14 实测：接受整数 0–3，字符串一律被拒
    note: |
      ★ 必须传整数枚举，传字符串（'OpticalFlow' 等）返回 False。
      0–3 四档均被接受，具体档位含义待 Phase 6 逐档渲染比对确定。

# ─────────────────────────────────────────────────────────────
# 方法已确认存在，待 Phase 1/6 实测（这些是本次探测最大的收获）
# ─────────────────────────────────────────────────────────────

  # ─── 以下三项经 Phase 1.12–1.14 实测判定为不可用 ───
  # 教训：hasattr / 方法存在 完全不能作为可用性依据，必须实跑并验证输出。

  speed_ramp:
    path: unsupported
    api: "TimelineItem.SetSpeedRamp"
    probed: true
    verified: false
    available: false
    fallback: "Fusion comp 内做变速（TimeSpeed / TimeStretcher 节点），经 ImportFusionComp 注入"
    priority: high
    evidence: probe_key_capabilities2.py
    note: |
      ★ hasattr 假阳性 ★
      dir(item) 中存在 SetSpeedRamp，但 item.SetSpeedRamp 的值是 None，
      callable() 为 False —— 方法在 21.0.3 中并不存在。
      Resolve 的远程对象对未知属性返回 None 而非抛 AttributeError，
      因此 hasattr 恒为 True。
      同时探测：Speed / SpeedPercent / PlaybackSpeed 属性均不可写，
      片段上与变速相关的方法只有 GetDuration。
      结论：**Resolve 21.0.3 没有逐片段变速的脚本接口**。
      变速必须走 Fusion Recipe 路线（add_fusion_comp 已 verified）。

  subject_tracking:
    path: unsupported
    api: "TimelineItem.CreateMagicMask / RegenerateMagicMask"
    probed: true
    verified: false
    available: false
    fallback: "自研主体检测（Phase 3）+ 手动 Pan/ZoomX（transform 已 verified）"
    priority: high
    edition_required: studio
    evidence: probe_key_capabilities.py, probe_key_capabilities2.py
    note: |
      所有签名（'F' / 'B' / 'BI' / 无参 / 整数）一律返回 False，
      切到 Color 页并定位时间码后重试仍为 False，节点数不变（保持 1）。
      判定为脚本接口不可用。

  portrait_reframe:
    path: unsupported
    api: "TimelineItem.SmartReframe"
    probed: true
    verified: false
    available: false
    fallback: "自研主体感知 + SetProperty('Pan'/'ZoomX')，后者已 verified"
    priority: critical
    edition_required: studio
    evidence: probe_smartreframe_visual.py, smartreframe_visual.json
    note: |
      ★ 最重要的否定结论，且是「返回 True 但空转」这一类最危险的失败 ★

      SmartReframe() 返回 True，但：
        - GetProperty 的 Pan/ZoomX/Tilt 全部不变
        - 渲染输出与基线**逐字节相同**（首帧 md5 一致）

      判定方法的可信度已由对照组建立：
      同一片段手动 SetProperty('Pan', 400) 后重渲，md5 改变、YAVG 从 80.6 变为 50.8。
      即检测手段有效，SmartReframe 确实没有产生任何效果。

      （第一版探测曾误取 780s 之外的黑场画面，导致对照组也"无差异"。
        黑场上任何重构图都不可见 —— 视觉验证必须先确认画面有内容。）

      影响：横屏→4:5 的主体感知重构图无法依赖 Resolve 原生能力，
      改为在 Phase 3 用自研主体检测产出 Pan/ZoomX 参数，
      再经已验证的 transform 通道写入。可控性反而更好，但工作量增加。

  stabilize:
    path: native_api
    api: "TimelineItem.Stabilize"
    probed: true
    verified: false
    priority: low

  color_recipe:
    path: native_api
    api: "SetLUT / SetCDL / GetNodeGraph / CopyGrades / AssignToColorGroup / AddVersion"
    probed: true
    verified: false
    priority: high
    note: |
      ColorGroup + Version 是比逐 clip 调色更好的架构：
      一个 Color Recipe = 一个 ColorGroup，clip 加入 group 即继承调色，
      改 recipe 只需改 group。这比 EditSpec 里每个 clip 存一份 grade 干净得多。

  export_lut:
    path: native_api
    api: "TimelineItem.ExportLUT"
    probed: true
    verified: false
    note: "可把调好的 grade 导成 LUT，作为 recipe 产物存档"

  scene_cut_detection:
    path: native_api
    api: "Timeline.DetectSceneCuts"
    probed: true
    verified: false
    priority: low
    note: "Resolve 自带分镜检测，可与 PySceneDetect 结果交叉验证"

  subtitles_from_audio:
    path: native_api
    api: "Timeline.CreateSubtitlesFromAudio"
    probed: true
    verified: false
    priority: low
    note: "可能替代 whisper.cpp 做台词提取"

  fusion_title_generator:
    path: fusion_api
    api: "Timeline.InsertFusionTitleIntoTimeline / InsertFusionCompositionIntoTimeline"
    probed: true
    verified: false
    note: "Hook 文案层（旧 TextOverlay）的落地路径"

# ─────────────────────────────────────────────────────────────
# 未探测 / 未知
# ─────────────────────────────────────────────────────────────

  transition:
    path: unverified
    probed: false
    verified: false
    fallback: hard_cut
    priority: high
    note: "TimelineItem 上未见直接的 transition API，需研究 Timeline 层或 Fusion 转场方案"

  fairlight_automation:
    path: unverified
    probed: false
    verified: false
    fallback: "ffmpeg 音频床（旧 sound.py 路径）"
    priority: medium

  audio_track_management:
    path: native_api
    api: "Timeline.AddTrack('audio', ...)"
    probed: true
    verified: false
    priority: high

  gui_automation:
    path: gui_fallback
    probed: false
    verified: false
    enabled: false            # 默认禁用，需显式开关且必须记录
    note: "MASTER PLAN §25：最后手段，禁止设计成核心能力"

# ─────────────────────────────────────────────────────────────
# 实测踩到的坑（写进来防止重复踩）
# ─────────────────────────────────────────────────────────────
pitfalls:
  - id: P1
    issue: "进程名是 Resolve 不是 DaVinci Resolve"
    impact: "pgrep -x 'DaVinci Resolve' 永远失败，会误判未运行"
    fix: "健康检查用 pgrep -x Resolve"

  - id: P2
    issue: "Resolve 未运行时 scriptapp('Resolve') 静默返回 None，不抛异常"
    impact: "错误信息不明确，难排查"
    fix: "connection.py 必须显式判空并给出「请先启动 Resolve」的提示"

  - id: P3
    issue: "系统 Python 3.14 与 fusionscript 不兼容"
    impact: "import 失败"
    fix: "强制 venv 3.11；connection.py 启动时校验 sys.version_info"

  - id: P4
    issue: "素材实际 FPS 是 23.976（实测代理 1920x1080 / H.264 / 23.976）"
    impact: |
      旧 EditSpec 硬编 60fps 是错的。23.976 是非整数帧率，
      帧制 IR 必然产生亚帧漂移累积。
    fix: "EditSpec 以秒为权威 + 显式 timebase，帧数由 compiler 换算（TARGET §3.1 A1 决策由此得到实测支持）"

  - id: P5
    issue: "Resolve 必须前台运行，无真正 headless"
    impact: "批量自动化受限"
    fix: "启动等待 + 健康检查；渲染任务串行排队"

  # ── 以下为 Phase 1 实测新增（2026-07-25），每一条都曾导致片段静默错位 ──

  - id: P6
    issue: "源素材自带的章节标记会被时间线片段继承，且 Resolve 拒绝在已有标记的帧上再加标记"
    impact: |
      蓝光/WEB 片源常在第 0 帧就有 "Chapter N"。
      在第 0 帧写 clip_id 标记会静默失败，导致增量更新无法定位该片段。
    fix: "mark_clip 向后扫描第一个空闲帧；查找时只认 aes: 前缀的 customData"

  - id: P7
    issue: "GetSourceStartFrame() 含媒体起始时间码；GetLeftOffset() 在跨帧率时被套格重映射"
    impact: |
      实测 29.97 素材放进 24fps 时间线，请求源帧 720 后 GetLeftOffset() 返回 576。
      用任一帧号反推源入点都会错。
    fix: "统一用 GetSourceStartTime() / GetSourceEndTime()，它们直接返回秒，跨帧率语义稳定"

  - id: P8
    issue: "AppendToTimeline 的 endFrame 是开区间"
    impact: "按闭区间处理会让每个片段少一帧"
    fix: "endFrame = startFrame + 帧数，不减 1。实测 240→288 得 48 帧"

  - id: P9
    issue: "时间线起始帧默认是 86400（01:00:00:00），不是 0"
    impact: |
      recordFrame 若不加这个偏移，第二个及以后的片段会被静默丢弃 ——
      AppendToTimeline 对失败项返回 None 而不抛异常。
    fix: "recordFrame = timeline.GetStartFrame() + 目标帧；并显式检查返回值中的 None"

  - id: P10
    issue: "AppendToTimeline 只能在时间线末端追加，无法填补轨道中间的空洞"
    impact: |
      ★ 架构级约束 ★
      「删掉变化的片段再插回原位」这条增量更新路线走不通，该位置返回 None。
    fix: |
      时间线总是全量重建（按时间线位置升序放置）；
      增量下沉到渲染层 —— compiler 报告 changed_ranges，只渲变化区间。
      在 Resolve 里搭时间线是廉价的，渲染才是昂贵的。

  - id: P11
    issue: "源帧数按「入点 floor + 出点 ceil」计算会让片段多出一帧"
    impact: "实测 29.97 素材取 2.0s 得 61 源帧，套格到 24fps 后是 49 帧而非 48"
    fix: "按时长取帧：n = duration_frames(in, duration)，end = start + n"

  - id: P12
    issue: "hasattr / dir() 对 Resolve 远程对象是假阳性"
    impact: |
      ★ 方法论级教训 ★
      远程对象对未知属性返回 None 而非抛 AttributeError，
      因此 hasattr(item, 'SetSpeedRamp') 恒为 True，即便该方法根本不存在。
      Phase 0 的能力探测正是因此误把 SetSpeedRamp 记为「方法存在」。
    fix: |
      判定可用性必须三步走：
        1. callable(getattr(obj, name, None)) —— 而非 hasattr
        2. 实际调用并检查返回值
        3. 验证**输出确实改变**（渲染出帧比对）
      能力矩阵中 probed / verified / available 三个字段分别对应这三步。

  - id: P13
    issue: "「返回 True 但不生效」是 Resolve API 最危险的失败模式"
    impact: |
      SmartReframe() 返回 True，属性不变，渲染输出逐字节相同。
      只看返回值会得出完全错误的结论，并把它写进能力矩阵传播下去。
    fix: |
      凡是影响画面的能力，verified 必须由**渲染出帧比对**支撑，不能只看返回值。
      且必须先跑对照组（一个已知会改变画面的操作）确认检测手段有效。

  - id: P14
    issue: "视觉比对若取到黑场，任何变化都不可见"
    impact: "第一版 SmartReframe 验证误取近全黑帧（YAVG≈30），连对照组都判为无差异"
    fix: "比对前先扫描素材挑亮度适中的时间点（40 < YAVG < 200）"
