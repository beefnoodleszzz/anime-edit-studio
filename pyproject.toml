[project]
name = "anime-edit-studio"
version = "2.0.0.dev0"
description = "Demo 驱动的 AMV 生成引擎：分析剪辑语言、按目标音乐重算节奏、自动选素材、在 DaVinci Resolve 中生成 AMV"
# 上界由 fusionscript 决定：Resolve 21 的脚本模块不支持 3.14+（AGENTS.md P3）
requires-python = ">=3.11,<3.14"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scenedetect>=0.6.4",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "rich>=13.7",
    "librosa>=0.10",
]

[project.optional-dependencies]
# 重模型能力，按需安装：uv pip install -e ".[ml]"
ml = [
    "open-clip-torch>=2.24",   # CLIP 语义检索 (ViT-B-32, MPS)
    "wdtagger>=0.16",          # 动漫打标 (Danbooru v3, ONNX)
]
# ShotWindow 选镜阶段的 Python 3.11 兼容轻/中量视觉后端，按需安装：
# uv pip install -e ".[vision]"（REFACTOR.md §20）
vision = [
    "onnxruntime>=1.18",       # 动漫脸检测优先走 ONNX Runtime
]
# CoTracker/SAM2/DOVER 等仅用于每槽位前 5-8 名精筛的可选重模型后端；
# 缺失时自动降级到轻量 fallback，不阻塞 selection 流程（REFACTOR.md §7.3/§7.4）：
# uv pip install -e ".[vision-heavy]"
vision-heavy = [
    "torch>=2.2",
    "torchvision>=0.17",
]
dev = [
    "pytest>=9.0",
    "soundfile>=0.12",
]

[project.scripts]
# v2 入口。v1 的 `anime` 命令已随 anime/ 一起废弃，见 tag v1-final
aes = "studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["projects", "library", ".venv"]
markers = [
    "requires_resolve: 需要本机运行 DaVinci Resolve，CI 中跳过",
]
