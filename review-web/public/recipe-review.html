<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Recipe 人工验收 · Anime Edit Studio</title>
  <style>
    :root{font-family:Inter,"PingFang SC",sans-serif;color:#17192a;background:#f7f6fa}
    *{box-sizing:border-box}body{margin:0}header{padding:42px max(24px,5vw);background:#20243b;color:white}
    header p{max-width:760px;color:#bcc3dc;line-height:1.65}h1{margin:0 0 12px;font-size:clamp(28px,4vw,54px)}
    .toolbar{display:flex;gap:16px;align-items:end;flex-wrap:wrap;padding:24px max(24px,5vw);position:sticky;top:0;background:#f7f6faeF;backdrop-filter:blur(12px);z-index:2;border-bottom:1px solid #dddde8}
    label{display:grid;gap:7px;font-size:12px;color:#61657a}input,textarea{border:1px solid #cfd1df;border-radius:9px;padding:10px 12px;background:white;font:inherit}
    #reviewer{width:240px}.progress{margin-left:auto;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px;padding:28px max(24px,5vw) 64px}
    article{background:white;border:1px solid #dddde8;border-radius:16px;overflow:hidden;box-shadow:0 12px 35px #262b4910}
    article.accepted{border-color:#44a77a}article.rejected{border-color:#d66b6b}video{width:100%;aspect-ratio:16/9;background:#111;display:block}
    .body{padding:18px}.meta{display:flex;justify-content:space-between;gap:12px}.meta h2{font-size:18px;margin:0}.tag{font-size:11px;text-transform:uppercase;color:#60657c}
    textarea{width:100%;min-height:70px;margin:14px 0}.actions{display:flex;gap:10px}.actions button{flex:1;border:0;border-radius:9px;padding:11px;font-weight:700;cursor:pointer}
    .accept{background:#1f8c61;color:white}.reject{background:#f3dede;color:#9c3434}.status{font-size:12px;font-weight:700;text-transform:uppercase}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.progress{margin-left:0;width:100%}}
  </style>
</head>
<body>
  <header>
    <h1>Recipe 人工验收台</h1>
    <p>请完整观看每个样片后明确接受或拒绝。这里仅记录你的判断；系统不会自动把 PENDING 改成通过。拒绝项会继续保持不可用。</p>
  </header>
  <div class="toolbar">
    <label>验收人<input id="reviewer" placeholder="请输入姓名或称呼" /></label>
    <div class="progress" id="progress">读取中…</div>
  </div>
  <main class="grid" id="grid"></main>
  <script>
    const grid=document.querySelector("#grid"),progress=document.querySelector("#progress"),reviewer=document.querySelector("#reviewer");
    reviewer.value=localStorage.getItem("aes-reviewer")||"";
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
    async function load(){
      const data=await fetch("/recipe-reviews").then(r=>r.json());
      const done=data.recipes.filter(x=>x.status!=="pending").length;
      progress.textContent=`已验收 ${done} / ${data.recipes.length}`;
      grid.innerHTML=data.recipes.map(x=>`<article class="${x.status}" data-id="${esc(x.id)}">
        <video controls preload="metadata" src="${esc(x.preview_url)}"></video>
        <div class="body"><div class="meta"><div><h2>${esc(x.id)}</h2><span class="tag">${esc(x.kind)} · ${esc(x.version)}</span></div><span class="status">${esc(x.status)}</span></div>
        <textarea placeholder="拒绝时请说明原因；接受时可写观察备注"></textarea>
        <div class="actions"><button class="reject" data-decision="rejected">拒绝并继续修改</button><button class="accept" data-decision="accepted">接受</button></div></div></article>`).join("");
    }
    grid.addEventListener("click",async event=>{
      const button=event.target.closest("button[data-decision]");if(!button)return;
      if(!reviewer.value.trim()){reviewer.focus();alert("请先填写验收人");return}
      localStorage.setItem("aes-reviewer",reviewer.value.trim());
      const card=button.closest("article"),notes=card.querySelector("textarea").value;
      button.disabled=true;
      const response=await fetch(`/recipe-reviews/${encodeURIComponent(card.dataset.id)}/decision`,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({reviewer:reviewer.value.trim(),decision:button.dataset.decision,notes,reviewed_at:new Date().toISOString()})
      });
      if(!response.ok){alert((await response.json()).detail||"保存失败");button.disabled=false;return}
      await load();
    });
    load().catch(error=>progress.textContent=`读取失败：${error.message}`);
  </script>
</body>
</html>
