[project]
name = "anime-edit-studio"
version = "2.0.0.dev0"
description = "AI 导演 / EditSpec IR / DaVinci Resolve 执行的动漫短视频生产系统"
# 上界由 fusionscript 决定：Resolve 21 的脚本模块不支持 3.14+（AGENTS.md P3）
requires-python = ">=3.11,<3.14"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scenedetect>=0.6.4",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "rich>=13.7",
    "librosa>=0.10",
]

[project.optional-dependencies]
# 重模型能力，按需安装：uv pip install -e ".[ml]"
ml = [
    "open-clip-torch>=2.24",   # CLIP 语义检索 (ViT-B-32, MPS)
    "wdtagger>=0.16",          # 动漫打标 (Danbooru v3, ONNX)
]
review = [
    "fastapi>=0.116",
    "uvicorn>=0.35",
]
dev = [
    "pytest>=9.0",
]

[project.scripts]
# v2 入口。v1 的 `anime` 命令已随 anime/ 一起废弃，见 tag v1-final
aes = "studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# v1 遗留测试已随 v1 归档，不参与 v2 CI
norecursedirs = ["projects", "library", "renderer", "review-web", ".venv"]
markers = [
    "requires_resolve: 需要本机运行 DaVinci Resolve，CI 中跳过",
]
