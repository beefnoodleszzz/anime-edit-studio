id: occlusion_cut_v1
version: 0.1.0
kind: transition
engine: resolve_fusion
capability: occlusion_cut
# UNVERIFIED: a two-sided bridge (out on the left clip, in on the right clip),
# NOT a merged CreateFusionClip — that destroys per-clip identity and blocks
# consecutive transitions.  The subject sweeping across (W4a horizontal_sweep)
# hides the join.  Requires GUI-built comps for both sides, Export + code
# Import + param-inject, and a render check that the join is masked and both
# clips keep their frame counts.  Not executable until then.
verified: false
parameters:
  wipe_frames:
    type: int
    min: 2
    max: 16
    default: 6
bindings:
  wipe_frames: "OcclusionWipe.Duration"
