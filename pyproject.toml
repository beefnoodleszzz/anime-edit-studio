[project]
name = "anime-edit-studio"
version = "0.1.0"
description = "私有 AI 动漫剪辑导演工作站 —— AI 镜头库/检索 + Remotion 渲染"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "scenedetect>=0.6.4",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "rich>=13.7",
    "librosa>=0.10",
]

[project.optional-dependencies]
# 重模型能力(语义检索 / 主体遮罩),按需安装:uv pip install -e ".[ml]"
ml = [
    "open-clip-torch>=2.24",   # CLIP 语义检索(ViT-B-32,MPS)
    "rembg>=2.0",              # 主体遮罩(isnet-anime)
    "wdtagger>=0.16",          # 动漫打标(Danbooru v3:角色名+属性,ONNX,~400MB)
]

[project.scripts]
anime = "anime.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anime"]
